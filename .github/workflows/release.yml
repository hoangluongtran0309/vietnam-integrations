name: Release to Maven Central

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false
          ./mvnw -B -f vietnam-bom/pom.xml versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Publish
        run: ./mvnw -B -Prelease deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

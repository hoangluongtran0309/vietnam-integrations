vietnam:
  vietqr:
    # Replace with your own account to test with a real banking app
    bank-bin: "970436"
    account-number: "0123456789"
    reference:
      prefix: "DH"
  zalo-oa:
    enabled: ${ZALO_ENABLED:false}
    # Single-OA configuration remains the simplest way to run the demo.
    app-id: ${ZALO_APP_ID:}
    secret-key: ${ZALO_APP_SECRET_KEY:}
    oa-id: ${ZALO_OA_ID:}
    oa-secret-key: ${ZALO_OA_SECRET_KEY:}
    token-store: ${ZALO_TOKEN_STORE:memory}
    webhook:
      enabled: ${ZALO_WEBHOOK_ENABLED:false}
      path: /webhooks/zalo

    # For multiple OAs, remove oa-id and oa-secret-key above, then configure aliases:
    # default-account: cskh
    # accounts:
    #   cskh:
    #     oa-id: ${ZALO_CSKH_OA_ID:}
    #     oa-secret-key: ${ZALO_CSKH_OA_SECRET_KEY:}
    #   marketing:
    #     oa-id: ${ZALO_MARKETING_OA_ID:}
    #     oa-secret-key: ${ZALO_MARKETING_OA_SECRET_KEY:}
    #     app-id: ${ZALO_MARKETING_APP_ID:} # Optional: when this OA belongs to another App
    #     secret-key: ${ZALO_MARKETING_APP_SECRET_KEY:}

spring:
  servlet:
    multipart:
      # Phone screenshots uploaded to /decode-image are often larger than the 1MB default
      max-file-size: 10MB
      max-request-size: 10MB

demo:
  zalo:
    redirect-uri: ${ZALO_REDIRECT_URI:http://localhost:8080/zalo/oauth/callback}
    jdbc-url: ${ZALO_JDBC_URL:}
    jdbc-user: ${ZALO_JDBC_USER:}
    jdbc-password: ${ZALO_JDBC_PASSWORD:}
